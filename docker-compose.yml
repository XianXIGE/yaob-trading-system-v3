version: '3.8'

services:
  # ===================== MySQL 8.0 =====================
  mysql:
    image: mysql:8.0
    container_name: yaob-mysql
    restart: always
    environment:
      # 以下三个变量必须显式提供，不再提供默认值（防止密钥/口令提交到公开仓库）
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: yaob_v3
      MYSQL_USER: yaob
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - yaob-net

  # ===================== Redis 7 =====================
  redis:
    image: redis:7-alpine
    container_name: yaob-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - yaob-net

  # ===================== Java 后端 =====================
  backend:
    image: yaob-backend:3.4.2
    container_name: yaob-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yaob_v3?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: yaob
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FAPI_PROXY: http://host.docker.internal:10809
      ADMIN_USER: ${ADMIN_USER}
      YAOB_ENCRYPTION_KEY: ${YAOB_ENCRYPTION_KEY}
      COINGECKO_PROXY: http://host.docker.internal:10809
    ports:
      - "8101:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - yaob-net

  # ===================== Vue 前端 (Nginx) =====================
  web:
    image: yaob-trading-system-v3-web:latest
    container_name: yaob-web
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/yaob-web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - yaob-net

volumes:
  mysql_data:
    external: true
    name: yaob-trading-system-v3_mysql_data
  redis_data:
    external: true
    name: yaob-trading-system-v3_redis_data

networks:
  yaob-net:
    driver: bridge
