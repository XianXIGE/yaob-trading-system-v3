server:
  port: 8100

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/yaob_v3?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: yaob
    password: ${DB_PASSWORD:yaob_pass_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 3000ms
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yaob.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 币安合约 API
fapi:
  base: https://fapi.binance.com
  proxy: ${FAPI_PROXY:http://127.0.0.1:10809}

# CoinGecko 市值接口
coingecko:
  proxy: ${COINGECKO_PROXY:http://127.0.0.1:10809}

# 管理员用户名（从环境变量注入，无默认值）
admin:
  user: ${ADMIN_USER:}

# 加密密钥
yaob:
  encryption:
    key: ${YAOB_ENCRYPTION_KEY:yaob-v3-default-secret-key-change-me}

logging:
  level:
    com.yaob: INFO
