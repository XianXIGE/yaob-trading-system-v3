server:
  port: 8100
  servlet:
    session:
      cookie:
        http-only: true
        # 注意：当前部署走 http(150.158.91.2)，若 mis-set secure=true 会导致浏览器不发送 Cookie、登录失效。
        # 上线 HTTPS 后请改为 true。默认 false 以兼容现网 http。
        secure: ${SERVER_COOKIE_SECURE:false}
        same-site: lax
        # 会话过期时间(秒)，默认30分钟
        timeout: 30m

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/yaob_v3?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: yaob
    # 数据库密码：必须通过环境变量 DB_PASSWORD 注入，无默认值（缺失则启动失败）
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 3000ms
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yaob.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 日志（StdOutImpl 会打印含敏感字段的 SQL）。本地调试可改回 StdOutImpl。
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto

# 币安合约 API
fapi:
  base: https://fapi.binance.com
  proxy: ${FAPI_PROXY:http://127.0.0.1:10809}

# CoinGecko 市值接口
coingecko:
  proxy: ${COINGECKO_PROXY:http://127.0.0.1:10809}

# 管理员用户名（从环境变量注入，无默认值）
admin:
  # 管理员用户名：必须通过环境变量 ADMIN_USER 注入，无默认值（缺失则启动失败）
  user: ${ADMIN_USER}

# 用户并行扫描并发度（默认空=自动按 CPU 核数，范围 4-32；可通过 TRADE_SCAN_PARALLEL 覆盖）
trade:
  scan:
    parallel: ${TRADE_SCAN_PARALLEL:}

# 加密密钥：必须通过环境变量 YAOB_ENCRYPTION_KEY 注入，无默认值（缺失则启动失败）
# 严禁使用默认值——若保留默认值，等于把加密密钥暴露在公开仓库中
# 注意：轮换此密钥会使历史加密的币安 API Secret 无法解密，需配合数据迁移
yaob:
  encryption:
    key: ${YAOB_ENCRYPTION_KEY}

logging:
  level:
    com.yaob: INFO
